[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18.x"
  SECRETS_SCAN_ENABLED = "false"

# API Redirect Proxy to FastAPI Backend
[[redirects]]
  from = "/api/*"
  to = "https://prompt-squeeze-backend.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
